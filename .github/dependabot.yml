---
version: 2

updates:
  # The reusable workflows pin the actions every plugin release runs with, so their
  # updates land here once instead of in every plugin repository.
  - package-ecosystem: "github-actions"
    assignees:
      - "JanaME"
    cooldown:
      default-days: 7
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    groups:
      github-actions:
        patterns:
          - "*"
