---
name: CI

# Every change here reaches every plugin that calls these workflows, so it is linted
# and tested before it can be merged.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x wp-plugin/bin/*.sh tests/*.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SVN
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion
      - name: wp-plugin scripts
        run: bash tests/wp-plugin.sh
