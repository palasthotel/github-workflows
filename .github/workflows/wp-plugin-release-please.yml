---
name: WordPress plugin - release PR

# Opens and updates the release PR from conventional commits, and tags the release
# when it is merged. Called on every push to main.

on:
  workflow_call:
    inputs:
      app-id:
        description: "App id of the org-owned release bot - pass vars.RELEASE_BOT_APP_ID"
        required: true
        type: string
      config-file:
        required: false
        type: string
        default: "release-please-config.json"
      manifest-file:
        required: false
        type: string
        default: ".release-please-manifest.json"
      assignees:
        description: "Comma-separated GitHub users who get the release PR, as the Dependabot PRs - empty assigns nobody"
        required: false
        type: string
        default: "JanaME"
    secrets:
      RELEASE_BOT_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A short-lived token of the release bot instead of GITHUB_TOKEN: the tag this job
      # pushes has to trigger the deploy, and tags pushed with GITHUB_TOKEN trigger
      # nothing.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      # A release PR waits for someone to merge it: assign it, so it shows up in the
      # list of that person like the Dependabot PRs. Adding an assignee twice changes
      # nothing, so a PR that was only updated gets the same.
      - name: Assign the release PR
        if: steps.release.outputs.prs_created == 'true' && inputs.assignees != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRS: ${{ steps.release.outputs.prs }}
          ASSIGNEES: ${{ inputs.assignees }}
        run: |
          args=()
          IFS=',' read -ra users <<< "$ASSIGNEES"
          for user in "${users[@]}"; do
            user="${user// /}"
            [[ -n "$user" ]] && args+=(-f "assignees[]=$user")
          done
          for number in $(jq -r '.[].number' <<< "$PRS"); do
            # A failed assignment must not fail the release job
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/assignees" "${args[@]}" --silent \
              && echo "🤖 #$number assigned to $ASSIGNEES" \
              || echo "::warning::Could not assign #$number to $ASSIGNEES"
          done
