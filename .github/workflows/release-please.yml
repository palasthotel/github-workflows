---
name: Release Please

# Releases this repository from conventional commits, and moves the major tag (v1)
# the plugin repositories call to the new release.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # v1.4.2 is immutable once released; v1 is a plain tag, not a release, and
      # moves with every 1.x release - that is the ref the plugin repositories use.
      - uses: actions/checkout@v6
        if: steps.release.outputs.release_created
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Move v${{ steps.release.outputs.major }} to the release
        if: steps.release.outputs.release_created
        env:
          MAJOR: v${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          git tag -f "$MAJOR" "$SHA"
          git push -f origin "refs/tags/$MAJOR"
