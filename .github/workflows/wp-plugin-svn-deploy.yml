---
name: WordPress plugin - deploy to WordPress.org

# Packs the plugin, attaches the zip to the GitHub release and commits the same
# payload to trunk and tags/<version> in the plugin's wordpress.org SVN.
#
# Called by the plugin repository on a release tag (v*, or tag-prefix*), or by
# workflow_dispatch with a version to re-run a failed deploy - see docs/wp-plugin.md.

on:
  workflow_call:
    inputs:
      slug:
        description: "wordpress.org slug - the SVN repository is plugins.svn.wordpress.org/<slug>"
        required: true
        type: string
      version:
        description: "Version to deploy without the tag prefix; empty means the tag that triggered the run"
        required: false
        type: string
        default: ""
      tag-prefix:
        description: "What comes before the version in the release tags, e.g. plugin-v in a repository that tags other packages too"
        required: false
        type: string
        default: "v"
      root:
        description: "The plugin project inside the repository"
        required: false
        type: string
        default: "."
      plugin-dir:
        description: "What ships, relative to root"
        required: false
        type: string
        default: "public"
      main-file:
        description: "The file with the plugin header, relative to plugin-dir; empty means detect"
        required: false
        type: string
        default: ""
      version-file:
        description: "version.txt or package.json, relative to root; empty means detect"
        required: false
        type: string
        default: ""
      build-command:
        description: "Runs in root before packing, e.g. npm ci && npm run build"
        required: false
        type: string
        default: ""
      exclude:
        description: "Newline-separated rsync patterns to leave out of the payload"
        required: false
        type: string
        default: ""
      assets-dir:
        description: "The plugin page's banner, icons and screenshots, relative to the repository root; empty means <root>/assets"
        required: false
        type: string
        default: ""
      dry-run:
        description: "Everything up to the SVN commit, which is only shown - for trying out a change to the deploy on a released version"
        required: false
        type: boolean
        default: false
      node-version:
        required: false
        type: string
        default: "24.x"
      php-version:
        description: "For composer, when the payload has a composer.json"
        required: false
        type: string
        default: "8.1"
      tools-ref:
        description: "Ref of palasthotel/github-workflows whose scripts are used - keep it equal to the ref in uses:"
        required: false
        type: string
        default: "v1"
    secrets:
      SVN_USERNAME:
        required: true
      SVN_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy to WordPress.org
    runs-on: ubuntu-latest
    env:
      # One line on purpose: a folded block scalar would keep line breaks inside ${{ }}
      RELEASE_TAG: ${{ inputs.version != '' && format('{0}{1}', inputs.tag-prefix, inputs.version) || github.ref_name }}
      TAG_PREFIX: ${{ inputs.tag-prefix }}
      SLUG: ${{ inputs.slug }}
      ROOT: ${{ inputs.root }}
      PLUGIN_DIR: ${{ inputs.plugin-dir }}
      MAIN_FILE: ${{ inputs.main-file }}
      VERSION_FILE: ${{ inputs.version-file }}
      EXCLUDE: ${{ inputs.exclude }}
      ASSETS_DIR: ${{ inputs.assets-dir }}
      TOOLS: ${{ github.workspace }}/.github-workflows/wp-plugin/bin
    steps:
      - name: Version from the tag
        run: |
          # A tag of another package of the repository, or a typo in the dispatch
          [[ "$RELEASE_TAG" == "$TAG_PREFIX"* ]] || { echo "::error::$RELEASE_TAG does not start with $TAG_PREFIX"; exit 1; }
          VERSION="${RELEASE_TAG#"$TAG_PREFIX"}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "🤖 Deploying $SLUG $VERSION"

      - uses: actions/checkout@v7

      - name: Check out the release scripts
        uses: actions/checkout@v7
        with:
          repository: palasthotel/github-workflows
          ref: ${{ inputs.tools-ref }}
          path: .github-workflows

      # Before anything is built or published: the tag has to match every carrier
      - name: Check version numbers
        run: bash "$TOOLS/check-version.sh"

      - uses: actions/setup-node@v7
        if: inputs.build-command != ''
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build
        if: inputs.build-command != ''
        working-directory: ${{ inputs.root }}
        run: ${{ inputs.build-command }}

      - name: Does the payload need composer?
        id: composer
        run: |
          if [[ -f "$ROOT/$PLUGIN_DIR/composer.json" ]]; then echo "needed=true" >> "$GITHUB_OUTPUT"; fi

      - uses: shivammathur/setup-php@v2
        if: steps.composer.outputs.needed == 'true'
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer

      - name: Pack
        run: bash "$TOOLS/pack.sh"

      - name: Attach the zip to the release
        if: ${{ ! inputs.dry-run }}
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          # Explicit, because on a dispatch run github.ref is a branch
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ inputs.root }}/${{ inputs.slug }}.zip

      - name: Install SVN
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Check out trunk, assets and tags/${{ env.VERSION }} from WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_URL: https://plugins.svn.wordpress.org/${{ env.SLUG }}/
        run: >-
          SVN_DIR=svn bash "$TOOLS/svn-checkout.sh"
          --username "$SVN_USERNAME" --password "$SVN_PASSWORD"
          --no-auth-cache --non-interactive

      - name: Prepare trunk and tags/${{ env.VERSION }}
        run: SVN_DIR=svn bash "$TOOLS/svn-prepare.sh"

      # The dry run stops here: a released version rebuilt from a later commit, e.g.
      # with updated dependencies, would otherwise change tags/<version> in place.
      - name: What the commit contains
        working-directory: svn
        run: |
          changes="$(svn status)"
          echo "${changes:-nothing - trunk and tags/$VERSION are unchanged}"

      - name: Commit to SVN
        if: ${{ ! inputs.dry-run }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        working-directory: svn
        run: >-
          svn commit -m "Release version $VERSION"
          --username "$SVN_USERNAME" --password "$SVN_PASSWORD"
          --no-auth-cache --non-interactive

      - name: Clean up the SVN checkout
        if: always()
        run: rm -rf svn

      - name: Done
        if: ${{ ! inputs.dry-run }}
        run: echo "🤖 $SLUG $VERSION deployed to https://wordpress.org/plugins/$SLUG/ 🚀"
